<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Название во вкладке -->
<title>Работа</title>

<!-- Иконка во вкладке (Светящийся полумесяц) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a1a36'/%3E%3Ccircle cx='45' cy='55' r='30' fill='%23fffbe6'/%3E%3Ccircle cx='65' cy='35' r='30' fill='%231a1a36'/%3E%3C/svg%3E">

<style>
  /* ===== RESET & THEMES ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root[data-theme="dark"] {
    --bg: #08080c;
    --text: #eef0f6;
    --muted: #9a9aae;
    --accent: #00ffc8;
    --accent-2: #7affff;
    --accent-bg: rgba(0, 255, 200, 0.15);
    --glass-bg: rgba(255, 255, 255, 0.045);
    --glass-bg-strong: rgba(255, 255, 255, 0.075);
    --glass-border: rgba(255, 255, 255, 0.09);
    --glass-border-hi: rgba(0, 255, 200, 0.45);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    --blob-1: rgba(0, 255, 200, 0.5);
    --blob-2: rgba(140, 100, 255, 0.45);
    --blob-3: rgba(0, 160, 255, 0.4);
  }

  :root[data-theme="light"] {
    --bg: #f0f4f8;
    --text: #1a1a22;
    --muted: #5a5a6e;
    --accent: #00c89b;
    --accent-2: #0099ff;
    --accent-bg: rgba(0, 200, 155, 0.15);
    --glass-bg: rgba(255, 255, 255, 0.6);
    --glass-bg-strong: rgba(255, 255, 255, 0.85);
    --glass-border: rgba(0, 0, 0, 0.08);
    --glass-border-hi: rgba(0, 200, 155, 0.6);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    --blob-1: rgba(0, 255, 200, 0.25);
    --blob-2: rgba(140, 100, 255, 0.2);
    --blob-3: rgba(0, 160, 255, 0.2);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 0.4s ease, color 0.4s ease;
  }
  ::selection { background: var(--accent); color: #000; }

  /* ===== BACKGROUND ===== */
  .bg-layer {
    position: fixed; inset: 0; z-index: -3;
    background:
      radial-gradient(ellipse 70% 50% at 15% 10%, var(--blob-1), transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 20%, var(--blob-2), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, var(--blob-3), transparent 60%),
      var(--bg);
    transition: background 0.4s ease;
  }
  .grid-bg {
    position: fixed; inset: 0; z-index: -2;
    background-image:
      linear-gradient(var(--glass-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 100%);
    opacity: 0.5;
  }

  /* ===== TOP DISCLAIMER ===== */
  .disclaimer {
    width: 100%;
    max-width: 1000px;
    margin-bottom: 20px;
    padding: 12px 20px;
    background: rgba(0, 255, 200, 0.08);
    border: 1px solid var(--accent);
    border-radius: 14px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 4px 20px rgba(0, 255, 200, 0.1);
    position: relative;
    z-index: 10;
  }
  .disclaimer strong { color: var(--accent); }

  /* ===== THEME TOGGLE ===== */
  .theme-toggle {
    position: fixed; top: 20px; right: 20px;
    width: 44px; height: 44px;
    background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
    border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; color: var(--text); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: all 0.2s; z-index: 100;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== LAYOUT ===== */
  .app {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    position: relative;
    z-index: 1;
  }

  /* ===== GLASS PANEL ===== */
  .glass {
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: var(--glass-shadow), var(--glass-highlight);
    border-radius: 24px;
    padding: 28px;
    transition: all 0.3s ease;
  }

  /* ===== TIMER ===== */
  .timer-section { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer-header {
    font-size: 1rem; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 12px;
  }
  .timer-header.focus { color: var(--accent); }
  .timer-header.break { color: #ffaa00; }

  /* Пресеты времени */
  .presets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
    width: 100%;
  }
  .preset-btn {
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .preset-btn:hover { background: var(--glass-bg-strong); color: var(--text); }
  .preset-btn.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
  }

  .timer-ring {
    position: relative; width: 240px; height: 240px; margin-bottom: 24px;
  }
  .timer-ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .timer-ring circle {
    fill: none; stroke-width: 6; stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.4s;
  }
  .ring-bg { stroke: var(--glass-border); }
  .ring-progress { stroke: var(--accent); stroke-dasharray: 722; stroke-dashoffset: 0; }
  .timer-section.break .ring-progress { stroke: #ffaa00; }

  .timer-display {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.4rem; font-weight: 800; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .timer-controls { display: flex; gap: 12px; }
  .btn {
    padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
    cursor: pointer; border: 1px solid var(--glass-border);
    background: var(--glass-bg); color: var(--text);
    transition: all 0.2s; font-family: inherit;
  }
  .btn:hover { background: var(--glass-bg-strong); border-color: var(--accent); }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: #00201a;
    box-shadow: 0 4px 15px var(--accent-bg);
  }
  .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  
  /* Стили для неактивных кнопок таймера */
  .btn:disabled, .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: grayscale(100%);
    box-shadow: none;
  }
  .btn-primary:disabled:hover { background: var(--accent); border-color: var(--accent); }

  /* ===== TASKS ===== */
  .tasks-section h2 { font-size: 1.2rem; margin-bottom: 16px; }
  .task-form { display: flex; gap: 8px; margin-bottom: 16px; }
  .task-input {
    flex: 1; padding: 12px 14px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.95rem;
    outline: none; transition: border-color 0.2s;
  }
  .task-input:focus { border-color: var(--accent); }
  .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding-right: 4px; }
  .task-list::-webkit-scrollbar { width: 4px; }
  .task-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
  
  .task-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--glass-bg);
    border: 1px solid var(--glass-border); border-radius: 10px;
    transition: all 0.2s;
  }
  .task-item:hover { background: var(--glass-bg-strong); }
  .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }
  
  .task-check {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--glass-border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .task-item.done .task-check { background: var(--accent); border-color: var(--accent); }
  .task-check::after {
    content: '✓'; color: #000; font-size: 12px; font-weight: bold;
    opacity: 0; transition: opacity 0.2s;
  }
  .task-item.done .task-check::after { opacity: 1; }
  
  .task-text { flex: 1; font-size: 0.95rem; word-break: break-word; }
  .task-delete {
    background: none; border: none; color: var(--muted); font-size: 1.2rem;
    cursor: pointer; padding: 0 4px; transition: color 0.2s; line-height: 1;
  }
  .task-delete:hover { color: #ff6b6b; }
  .empty-tasks { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: 16px; }

  /* ===== AUDIO PANELS ===== */
  .audio-panel {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
    position: relative;
    transition: all 0.3s ease;
  }
  
  /* Блокировка аудио, пока таймер не запущен */
  .audio-panel.locked .audio-group {
    opacity: 0.4;
    pointer-events: none;
    filter: grayscale(100%);
  }
  .audio-panel.locked::after {
    content: '⏱ Запустите таймер, чтобы включить музыку';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--glass-bg-strong);
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    z-index: 10;
  }
  .audio-panel.locked .volume-control {
    opacity: 0.4;
    pointer-events: none;
  }

  .audio-group-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .audio-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .audio-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 100px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    color: var(--text); font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .audio-btn:hover { background: var(--glass-bg-strong); }
  .audio-btn.active {
    background: var(--accent-bg); border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 15px var(--accent-bg);
  }

  /* ===== VOLUME SLIDER ===== */
  .volume-control {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    padding: 0 4px;
  }
  .volume-control span { font-size: 1.2rem; }
  .volume-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--glass-border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-bg);
  }
  .volume-slider::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  /* ===== MOBILE ===== */
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .timer-ring { width: 200px; height: 200px; }
    .timer-display { font-size: 3rem; }
    .glass { padding: 20px; }
    .audio-panel { padding: 16px; }
    .audio-btn { padding: 8px 14px; font-size: 0.8rem; }
    .audio-panel.locked::after { font-size: 0.8rem; padding: 8px 16px; white-space: normal; width: 80%; text-align: center; }
    .preset-btn { padding: 4px 8px; font-size: 0.75rem; }
    .disclaimer { font-size: 0.75rem; padding: 10px 14px; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="grid-bg"></div>

<!-- ДИСКЛЕЙМЕР СВЕРХУ -->
<div class="disclaimer">
  ℹ️ <strong>Внимание:</strong> Музыка и звуки природы предоставляются сторонними открытыми сервисами «как есть» (SomaFM, Pixabay). Возможны кратковременные перебои в работе потоков.
</div>

<button class="theme-toggle" id="themeToggle" title="Сменить тему">🌙</button>

<div class="app">
  
  <!-- ЛЕВАЯ ПАНЕЛЬ: ТАЙМЕР -->
  <div class="glass timer-section" id="timerSection">
    <div class="timer-header focus" id="timerHeader">Время работать</div>
    
    <!-- Пресеты времени -->
    <div class="presets" id="presets">
      <button class="preset-btn active" data-time="1800">30 мин</button>
      <button class="preset-btn" data-time="3600">1 час</button>
      <button class="preset-btn" data-time="7200">2 часа</button>
      <button class="preset-btn" data-time="10800">3 часа</button>
      <button class="preset-btn" data-time="0">Без таймера</button>
    </div>

    <div class="timer-ring">
      <svg viewBox="0 0 260 260">
        <circle class="ring-bg" cx="130" cy="130" r="115"></circle>
        <circle class="ring-progress" cx="130" cy="130" r="115" id="ringProgress"></circle>
      </svg>
      <div class="timer-display" id="timerDisplay">30:00</div>
    </div>

    <div class="timer-controls">
      <button class="btn btn-primary" id="startBtn">Старт</button>
      <button class="btn" id="resetBtn">Сброс</button>
    </div>
  </div>

  <!-- ПРАВАЯ ПАНЕЛЬ: ЗАДАЧИ -->
  <div class="glass tasks-section">
    <h2>Мои задачи</h2>
    <form class="task-form" id="taskForm">
      <input type="text" class="task-input" id="taskInput" placeholder="Что нужно сделать?" autocomplete="off">
      <button type="submit" class="btn btn-primary" style="padding: 12px 16px;">+</button>
    </form>
    <ul class="task-list" id="taskList"></ul>
    <div class="empty-tasks" id="emptyTasks">Пока нет задач. Добавь первую!</div>
  </div>

  <!-- НИЖНЯЯ ПАНЕЛЬ: АУДИО -->
  <div class="glass audio-panel locked" id="audioPanel">
    <div class="audio-group">
      <div class="audio-group-title">🌧 Эмбиент</div>
      <div class="audio-row">
        <button class="audio-btn" data-sound="rain">🌧 Дождь</button>
        <button class="audio-btn" data-sound="ocean">🌊 Океан</button>
        <button class="audio-btn" data-sound="wind">💨 Ветер</button>
        <button class="audio-btn" data-sound="fire">🔥 Костёр</button>
      </div>
    </div>

    <div class="audio-group">
      <div class="audio-group-title">🎵 Фоновая музыка</div>
      <div class="audio-row">
        <button class="audio-btn" data-music="lofi">☕ Lo-Fi / Chill</button>
        <button class="audio-btn" data-music="ambient">🌌 Ambient</button>
        <button class="audio-btn" data-music="focus">🧠 Deep Focus</button>
      </div>
    </div>

    <div class="volume-control">
      <span>🔊</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="40">
    </div>
  </div>

</div>

<script>
  // ===== 1. ТЕМА =====
  const themeToggle = document.getElementById('themeToggle');
  const html = document.documentElement;
  
  if (localStorage.getItem('theme') === 'light') {
    html.setAttribute('data-theme', 'light');
    themeToggle.textContent = '☀️';
  }

  themeToggle.addEventListener('click', () => {
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeToggle.textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  });

  // ===== 2. ТАЙМЕР =====
  const timerDisplay = document.getElementById('timerDisplay');
  const timerHeader = document.getElementById('timerHeader');
  const timerSection = document.getElementById('timerSection');
  const ringProgress = document.getElementById('ringProgress');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const audioPanel = document.getElementById('audioPanel');
  const presetBtns = document.querySelectorAll('.preset-btn');

  const BREAK_TIME = 5 * 60;
  const CIRCLE_LEN = 2 * Math.PI * 115;

  let selectedWorkTime = 30 * 60;
  let timeLeft = selectedWorkTime;
  let isRunning = false;
  let isBreak = false;
  let timerInterval = null;
  let isTimerless = false;

  ringProgress.style.strokeDasharray = CIRCLE_LEN;

  function formatTime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function updateTimerUI() {
    if (isTimerless) return;
    
    timerDisplay.textContent = formatTime(timeLeft);
    // Название во вкладке при работе
    document.title = isRunning ? `${timerDisplay.textContent} — Работа` : 'Работа';

    const total = isBreak ? BREAK_TIME : selectedWorkTime;
    const offset = CIRCLE_LEN - (timeLeft / total) * CIRCLE_LEN;
    ringProgress.style.strokeDashoffset = offset;
  }

  function toggleTimer() {
    if (isTimerless) return;
    
    isRunning = !isRunning;
    if (isRunning) {
      startBtn.textContent = 'Пауза';
      audioPanel.classList.remove('locked'); 
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Старт';
          playBeep();
          switchMode();
        }
        updateTimerUI();
      }, 1000);
    } else {
      startBtn.textContent = 'Продолжить';
      audioPanel.classList.add('locked'); 
      stopAllAudio();
      clearInterval(timerInterval);
    }
  }

  function resetTimer() {
    if (isTimerless) return;

    clearInterval(timerInterval);
    isRunning = false;
    startBtn.textContent = 'Старт';
    audioPanel.classList.add('locked'); 
    stopAllAudio();
    timeLeft = isBreak ? BREAK_TIME : selectedWorkTime;
    document.title = 'Работа';
    updateTimerUI();
  }

  function switchMode() {
    if (isTimerless) return;

    isBreak = !isBreak;
    timeLeft = isBreak ? BREAK_TIME : selectedWorkTime;
    
    if (isBreak) {
      audioPanel.classList.add('locked');
      stopAllAudio();
      timerHeader.textContent = 'Время отдохнуть';
      timerHeader.className = 'timer-header break';
      timerSection.classList.add('break');
    } else {
      audioPanel.classList.remove('locked'); 
      timerHeader.textContent = 'Время работать';
      timerHeader.className = 'timer-header focus';
      timerSection.classList.remove('break');
    }
    updateTimerUI();
  }

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Старт';
      }
      
      presetBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const timeVal = parseInt(btn.dataset.time, 10);
      
      if (timeVal === 0) {
        isTimerless = true;
        selectedWorkTime = 0;
        isBreak = false;
        timerHeader.textContent = 'Режим без таймера';
        timerHeader.className = 'timer-header focus';
        timerSection.classList.remove('break');
        timerDisplay.textContent = '∞';
        ringProgress.style.strokeDashoffset = 0;
        startBtn.disabled = true;
        resetBtn.disabled = true;
        audioPanel.classList.remove('locked');
        document.title = 'Работа (∞)';
      } else {
        isTimerless = false;
        selectedWorkTime = timeVal;
        isBreak = false;
        timerHeader.textContent = 'Время работать';
        timerHeader.className = 'timer-header focus';
        timerSection.classList.remove('break');
        startBtn.disabled = false;
        resetBtn.disabled = false;
        resetTimer();
      }
    });
  });

  startBtn.addEventListener('click', toggleTimer);
  resetBtn.addEventListener('click', resetTimer);
  updateTimerUI();

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);
      osc.start();
      osc.stop(ctx.currentTime + 1);
    } catch (e) { console.log('Audio not supported'); }
  }

  // ===== 3. ЗАДАЧИ =====
  const taskForm = document.getElementById('taskForm');
  const taskInput = document.getElementById('taskInput');
  const taskList = document.getElementById('taskList');
  const emptyTasks = document.getElementById('emptyTasks');

  let tasks = JSON.parse(localStorage.getItem('focus_tasks')) || [];

  function renderTasks() {
    taskList.innerHTML = '';
    if (tasks.length === 0) emptyTasks.style.display = 'block';
    else emptyTasks.style.display = 'none';

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = `task-item ${task.done ? 'done' : ''}`;
      
      const check = document.createElement('div');
      check.className = 'task-check';
      check.onclick = () => toggleTask(task.id);

      const text = document.createElement('div');
      text.className = 'task-text';
      text.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'task-delete';
      del.innerHTML = '&times;';
      del.onclick = () => deleteTask(task.id);

      li.append(check, text, del);
      taskList.appendChild(li);
    });
  }

  function addTask(e) {
    e.preventDefault();
    const text = taskInput.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now().toString(), text, done: false });
    taskInput.value = '';
    saveTasks();
    renderTasks();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.done = !task.done;
      saveTasks();
      renderTasks();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    renderTasks();
  }

  function saveTasks() {
    localStorage.setItem('focus_tasks', JSON.stringify(tasks));
  }

  taskForm.addEventListener('submit', addTask);
  renderTasks();

  // ===== 4. АУДИО (Эмбиент) =====
  const soundUrls = {
    rain: 'https://cdn.pixabay.com/audio/2022/07/13/audio_257112f8e7.mp3',
    ocean: 'https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3',
    wind: 'https://cdn.pixabay.com/audio/2022/03/10/audio_11b5b2d85d.mp3',
    fire: 'https://cdn.pixabay.com/audio/2022/03/09/audio_5c62332c81.mp3'
  };

  const ambientBtns = document.querySelectorAll('[data-sound]');
  const audioPlayers = {};

  function initAudio(type) {
    if (!audioPlayers[type]) {
      const audio = new Audio();
      audio.src = soundUrls[type];
      audio.loop = true;
      audio.volume = 0;
      audioPlayers[type] = audio;
    }
    return audioPlayers[type];
  }

  ambientBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.sound;
      const audio = initAudio(type);
      
      if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        audio.pause();
        audio.currentTime = 0;
      } else {
        btn.classList.add('active');
        audio.volume = masterVolume;
        audio.play().catch(e => console.log('Playback error:', e));
      }
    });
  });

  // ===== 5. ФОНОВАЯ МУЗЫКА =====
  const musicStreams = {
    lofi: 'https://ice1.somafm.com/groovesalad-128-mp3', 
    ambient: 'https://ice1.somafm.com/dronezone-128-mp3', 
    focus: 'https://ice1.somafm.com/deepspaceone-128-mp3'
  };

  const musicBtns = document.querySelectorAll('[data-music]');
  const volumeSlider = document.getElementById('volumeSlider');
  let currentMusic = null;
  let currentMusicBtn = null;
  let masterVolume = 0.4;

  volumeSlider.addEventListener('input', (e) => {
    masterVolume = e.target.value / 100;
    if (currentMusic) {
      currentMusic.volume = masterVolume;
    }
    Object.values(audioPlayers).forEach(audio => {
      if (!audio.paused) {
        audio.volume = masterVolume;
      }
    });
  });

  function stopCurrentMusic() {
    if (currentMusic) {
      currentMusic.pause();
      currentMusic.src = '';
      currentMusic = null;
    }
    if (currentMusicBtn) {
      currentMusicBtn.classList.remove('active');
      currentMusicBtn = null;
    }
  }

  function stopAllAudio() {
    stopCurrentMusic();
    Object.keys(audioPlayers).forEach(type => {
      const audio = audioPlayers[type];
      if (!audio.paused) {
        audio.pause();
        audio.currentTime = 0;
        const btn = document.querySelector(`[data-sound="${type}"]`);
        if (btn) btn.classList.remove('active');
      }
    });
  }

  musicBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.music;
      
      if (btn.classList.contains('active')) {
        stopCurrentMusic();
        return;
      }

      stopCurrentMusic();

      const audio = new Audio(musicStreams[type]);
      audio.volume = masterVolume;
      audio.play().catch(e => console.log('Stream error:', e));
      
      currentMusic = audio;
      currentMusicBtn = btn;
      btn.classList.add('active');
    });
  });
</script>

</body>
